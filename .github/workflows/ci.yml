name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-host:
    name: macOS host and harness
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: swift --version
      - name: Test gate
        # The signed launch check needs a GUI login session; the Windows agent runs on Windows below.
        run: ./script/test_all.sh --skip-app-verify --skip-windows-agent
      - name: Backtrace a crashing test
        # The runner writes no crash report and a test that dies on a signal prints nothing, so run
        # the test bundle under lldb and print every thread's stack at the crash.
        if: failure()
        working-directory: apps/mac-host
        run: |
          home="$(mktemp -d)"
          toolchain="$(dirname "$(dirname "$(xcrun --find swift)")")"
          helper="$toolchain/libexec/swift/pm/swiftpm-testing-helper"
          bundle=".build/arm64-apple-macosx/debug/VeilMacHostPackageTests.xctest/Contents/MacOS/VeilMacHostPackageTests"
          HOME="$home" CFFIXED_USER_HOME="$home" lldb --batch \
            -o run \
            -k "thread backtrace all -c 40" \
            -k quit \
            -- "$helper" --test-bundle-path "$bundle" "$bundle" --testing-library swift-testing 2>&1 \
            | grep -A400 -E "stop reason|signal SIGBUS|EXC_" | head -400 || true

  windows-agent:
    name: Windows guest agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test apps/windows-agent/tests/VeilAgent.Tests
