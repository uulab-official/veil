name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-host:
    name: macOS host and harness
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: swift --version
      - name: Test gate
        # The signed launch check needs a GUI login session; the Windows agent runs on Windows below.
        run: ./script/test_all.sh --skip-app-verify --skip-windows-agent
      - name: Crash reports
        # A test process that dies on a signal leaves only its exit code in the log; macOS writes the
        # crashing thread's stack to DiagnosticReports, under a name that depends on the process.
        if: failure()
        run: |
          # shellcheck disable=SC2012  # report names are macOS-generated; newest first matters here
          ls -lt "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports 2>/dev/null | head -20
          # shellcheck disable=SC2012
          for report in $(ls -t "$HOME"/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
            echo "::group::$report"
            head -c 80000 "$report"
            echo
            echo "::endgroup::"
          done

  windows-agent:
    name: Windows guest agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test apps/windows-agent/tests/VeilAgent.Tests
